<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI-Mate — Weapon inspect turntable</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --hy-blue: #0052d9;
  --hy-blue-600: #0043b3;
  --ink: #0a0e18;
  --ink-2: #1c2333;
  --body: #4a5568;
  --muted: #7b869b;
  --line: #e6eaf2;
  --line-soft: #eff2f8;
  --bg: #f6f8fc;
  --card: #fff;
  --dark: #0d1220;
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow: 0 1px 2px rgba(10,14,24,.05), 0 4px 14px rgba(10,14,24,.04);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--sans);
  color: var(--body);
  background: var(--bg);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
.brand {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 22px 0 0; font-size: 13.5px;
}
.brand-left { display: flex; align-items: center; gap: 12px; }
.brand img { height: 22px; width: auto; }
.brand a { color: var(--hy-blue); font-weight: 600; }
.lang-switch {
  display: flex; padding: 3px; background: #fff;
  border: 1px solid var(--line); border-radius: 999px;
}
.lang-switch button {
  height: 26px; border: 0; background: transparent;
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  color: var(--muted); padding: 0 11px; border-radius: 999px; cursor: pointer;
}
.lang-switch button:hover { color: var(--ink); }
.lang-switch button.is-active {
  color: #fff; background: var(--hy-blue);
  box-shadow: 0 2px 8px rgba(0, 82, 217, 0.3);
}
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 14px 20px;
  padding: 18px 0 12px;
}
h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.02em; color: var(--ink); }
.lede { margin: 8px 0 0; font-size: 14px; color: var(--body); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px; border-radius: 999px;
  background: #fff; border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2); font-weight: 600;
}
.pill.ok { color: #0f7b3a; border-color: #c8ead4; background: #f1fbf5; }
.pill.bad { color: #b42318; border-color: #f5c2c0; background: #fff4f3; }
.nav {
  display: inline-flex; align-items: center; gap: 8px; margin-left: auto;
}
.nav button, .tool {
  height: 34px; min-width: 34px; padding: 0 12px;
  border-radius: 10px; border: 1px solid rgba(0,82,217,.2);
  background: #fff; color: var(--hy-blue); font-weight: 700; cursor: pointer;
}
.nav button:hover:not(:disabled), .tool:hover:not(:disabled) { background: rgba(0,82,217,.06); }
.nav button:disabled, .tool:disabled { opacity: .35; cursor: default; }
.tool.is-on { background: var(--hy-blue); color: #fff; border-color: var(--hy-blue); }
.count { min-width: 12ch; text-align: center; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.task {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.task summary { cursor: pointer; font-weight: 650; color: var(--ink); font-size: 13.5px; }
.task p { margin: 10px 0 0; white-space: pre-wrap; font-size: 13.5px; color: var(--ink-2); }
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(280px, .9fr);
  gap: 18px; align-items: start; padding-bottom: 48px;
}
.shot {
  position: relative; background: var(--dark);
  border-radius: var(--r-lg); border: 1px solid var(--line);
  overflow: hidden; box-shadow: var(--shadow);
  aspect-ratio: 16 / 10;
  width: min(100%, calc(min(72vh, 820px) * 1.6));
  margin-inline: auto;
}
.shot img, .shot video {
  position: absolute; inset: 0;
  display: block; width: 100%; height: 100%;
  object-fit: fill; background: var(--dark);
}
.shot img[hidden], .shot video[hidden] { display: none !important; }
.marker {
  position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border-radius: 50%; border: 2px solid #fff;
  background: #ef4444; box-shadow: 0 0 0 2px rgba(239,68,68,.35);
  pointer-events: none;
}
.marker.move { background: #2b7cff; box-shadow: 0 0 0 2px rgba(43,124,255,.35); }
.marker[hidden] { display: none; }
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0;
}
.rates { display: inline-flex; gap: 4px; margin-left: auto; }
.rates .tool { min-width: 44px; padding: 0 8px; font-size: 12.5px; }
.fields { display: grid; gap: 12px; min-width: 0; }
.field {
  display: grid; gap: 6px; padding: 12px 14px;
  border: 1px solid var(--line-soft); border-radius: var(--r-sm); background: #fff;
}
.k {
  font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--hy-blue);
}
.v { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.v.think {
  height: 240px; overflow: auto; white-space: pre-wrap; font-size: 12.5px; line-height: 1.55;
}
.v.mono { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .nav, .rates { margin-left: 0; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-left">
        <img src="../assets/hy_logo.png" alt="Tencent Hunyuan" />
        <a href="../index.html">← UI-Mate</a>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
    <div class="top">
      <div>
        <h1 id="title">Session viewer</h1>
        <p class="lede" id="lede"></p>
        <div class="meta" id="meta"></div>
      </div>
      <div class="nav">
        <button type="button" id="prev" aria-label="Previous step">←</button>
        <span class="count" id="count">—</span>
        <button type="button" id="next" aria-label="Next step">→</button>
      </div>
    </div>
    <p class="hint" id="hint"></p>
    <details class="task">
      <summary id="taskSummary">Task</summary>
      <p id="task"></p>
    </details>
    <div class="grid">
      <section>
        <div class="shot" id="shot">
          <img id="img" alt="step screenshot" hidden />
          <video id="video" muted playsinline preload="auto"></video>
          <div class="marker" id="marker" hidden></div>
        </div>
        <div class="toolbar">
          <button type="button" class="tool" id="play">Play</button>
          <button type="button" class="tool" id="toggleShot" hidden>Show after</button>
          <span class="rates" id="rates" role="group" aria-label="Playback speed"></span>
        </div>
      </section>
      <aside class="fields">
        <div class="field">
          <span class="k" id="kThought">Thinking</span>
          <div class="v think" id="thought">—</div>
        </div>
        <div class="field">
          <span class="k" id="kAction">Action</span>
          <div class="v mono" id="action">—</div>
        </div>
        <div class="field">
          <span class="k" id="kDur">Step time</span>
          <div class="v" id="dur">—</div>
        </div>
      </aside>
    </div>
  </div>
  <script src="viewer-data.js"></script>
  <script>
  (function () {
    var S = window.SESSION;
    if (!S) return;
    var RATES = [0.5, 1, 2, 4, 8];
    var steps = S.steps || [];
    var i = 0;
    var showAfter = false;
    var playing = false;
    var rate = 1;
    var W = S.shot_w || 1920;
    var H = S.shot_h || 1080;
    var hasShots = steps.some(function (s) { return s && (s.before || s.after); });

    var title = document.getElementById("title");
    var lede = document.getElementById("lede");
    var meta = document.getElementById("meta");
    var task = document.getElementById("task");
    var img = document.getElementById("img");
    var video = document.getElementById("video");
    var marker = document.getElementById("marker");
    var count = document.getElementById("count");
    var thought = document.getElementById("thought");
    var action = document.getElementById("action");
    var dur = document.getElementById("dur");
    var prev = document.getElementById("prev");
    var next = document.getElementById("next");
    var playBtn = document.getElementById("play");
    var toggleShot = document.getElementById("toggleShot");
    var ratesEl = document.getElementById("rates");
    var hint = document.getElementById("hint");
    var taskSummary = document.getElementById("taskSummary");
    var kThought = document.getElementById("kThought");
    var kAction = document.getElementById("kAction");
    var kDur = document.getElementById("kDur");
    var STORE_KEY = "uimate.lang";

    var COPY = {
      en: {
        title: "Weapon inspect turntable · Blender",
        task: "This is a weapon inspect turntable task (art QA). The Blender scene is already open.\n- Rifle has a single material slot: replace Skin_Default with the existing Skin_Camo. Open the Shading tab; in the editor below, use the material dropdown (sphere icon) to the left of Skin_Default.\n- Do not move or modify the InspectCam camera.\n- At frame 1, select Rifle, press K, and choose Rotation to insert a rotation keyframe.\n- Jump to frame 90, set Rifle's Z Rotation to 360°, then press K → Rotation to insert a second keyframe.\n- Set Animation End to 90, leave Start at 1.\n- Output: Video, MPEG-4, H.264, path /Users/yingchenyu/Desktop/inspect_camo.\n- Use Render Animation to render and export the whole animation. When it finishes, end the task and open the rendered video in Finder.",
        hint: "Space to play / pause. ← → to step. Speed is on the right (default 1 s per frame).",
        taskSummary: "Task",
        play: "Play",
        pause: "Pause",
        showAfter: "Show after",
        showBefore: "Show before",
        prev: "Previous step",
        next: "Next step",
        rates: "Playback speed",
        success: "success",
        failed: "failed",
        steps: "steps",
        perFrame: "1s / frame",
        thinking: "Thinking",
        action: "Action",
        stepTime: "Step time",
        modelStep: "model step",
        playback: "playback",
        step: "Step"
      },
      zh: {
        title: S.title || "枪械检视跑测录制 · Blender",
        task: S.task,
        hint: "空格播放 / 暂停。← → 逐步查看。右侧可调倍速（默认 1 秒一帧）。",
        taskSummary: "任务说明",
        play: "播放",
        pause: "暂停",
        showAfter: "显示 after",
        showBefore: "显示 before",
        prev: "上一步",
        next: "下一步",
        rates: "播放倍速",
        success: "成功",
        failed: "失败",
        steps: "步",
        perFrame: "1s / 截图",
        thinking: "思考",
        action: "动作",
        stepTime: "单步耗时",
        modelStep: "模型步",
        playback: "播放",
        step: "Step"
      }
    };

    function resolveLang() {
      var fromQuery = new URLSearchParams(location.search).get("lang");
      if (fromQuery === "zh" || fromQuery === "en") return fromQuery;
      try {
        var stored = localStorage.getItem(STORE_KEY);
        if (stored === "zh" || stored === "en") return stored;
      } catch (e) { /* private mode */ }
      return /^zh\b/i.test(navigator.language || "") ? "zh" : "en";
    }

    var lang = resolveLang();

    function c(key) {
      var dict = COPY[lang] || COPY.en;
      return dict[key] != null ? dict[key] : (COPY.en[key] != null ? COPY.en[key] : key);
    }

    function applyLang() {
      document.documentElement.lang = lang;
      document.title = c("title") + " — UI-Mate";
      title.textContent = c("title");
      hint.textContent = c("hint");
      taskSummary.textContent = c("taskSummary");
      task.textContent = c("task");
      kThought.textContent = c("thinking");
      kAction.textContent = c("action");
      kDur.textContent = c("stepTime");
      prev.setAttribute("aria-label", c("prev"));
      next.setAttribute("aria-label", c("next"));
      ratesEl.setAttribute("aria-label", c("rates"));
      playBtn.textContent = playing ? c("pause") : c("play");
      meta.innerHTML =
        '<span class="pill ' + (S.success ? "ok" : "bad") + '">' + (S.success ? c("success") : c("failed")) + "</span>" +
        '<span class="pill">' + steps.length + " " + c("steps") + "</span>" +
        (S.model ? '<span class="pill">' + S.model + "</span>" : "") +
        '<span class="pill">' + c("perFrame") + "</span>";
      document.querySelectorAll(".lang-switch button").forEach(function (btn) {
        btn.classList.toggle("is-active", btn.dataset.lang === lang);
      });
    }

    lede.textContent = S.id || "";
    applyLang();

    if (S.video) {
      video.src = S.video;
      video.load();
    }
    video.playbackRate = rate;

    RATES.forEach(function (r) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tool" + (r === rate ? " is-on" : "");
      btn.setAttribute("data-rate", String(r));
      btn.textContent = r + "×";
      btn.addEventListener("click", function () { setRate(r); });
      ratesEl.appendChild(btn);
    });

    function setRate(next) {
      rate = next;
      video.playbackRate = rate;
      Array.prototype.forEach.call(ratesEl.querySelectorAll("[data-rate]"), function (btn) {
        btn.classList.toggle("is-on", Number(btn.getAttribute("data-rate")) === rate);
      });
    }

    function srcFor(step) {
      if (showAfter && step.after) return step.after;
      return step.before || step.after || "";
    }

    function seekVideo() {
      var t = Math.min(Math.max(i + 0.04, 0), Math.max((video.duration || steps.length) - 0.04, 0));
      try { video.currentTime = t; } catch (e) { /* ignore */ }
    }

    function setPlaying(on) {
      playing = on;
      playBtn.textContent = on ? c("pause") : c("play");
      showAfter = false;
      img.hidden = true;
      video.hidden = false;
      video.playbackRate = rate;
      if (on) {
        if (video.ended || video.currentTime >= (video.duration || 0) - 0.05) {
          video.currentTime = 0.04;
          i = 0;
        } else {
          seekVideo();
        }
        video.play();
      } else {
        video.pause();
        seekVideo();
      }
      render();
    }

    function goto(n, fromVideo) {
      if (!steps.length) return;
      i = Math.max(0, Math.min(steps.length - 1, n));
      if (!fromVideo) seekVideo();
      render();
    }

    function render() {
      var step = steps[i] || {};
      count.textContent = c("step") + " " + (i + 1) + " / " + steps.length;
      thought.textContent = step.thought || "—";
      thought.scrollTop = 0;
      action.textContent = step.action || "—";
      dur.textContent = step.duration_ms
        ? (step.duration_ms / 1000).toFixed(1) + "s " + c("modelStep") + " · " + c("playback") + " " + rate + "×"
        : c("playback") + " " + rate + "×";
      prev.disabled = i <= 0;
      next.disabled = i >= steps.length - 1;
      toggleShot.hidden = !hasShots;
      toggleShot.textContent = showAfter ? c("showBefore") : c("showAfter");
      toggleShot.disabled = !(step.before && step.after);

      var useImg = showAfter && srcFor(step);
      img.hidden = !useImg;
      video.hidden = !!useImg;
      if (useImg) {
        var src = srcFor(step);
        if (img.getAttribute("src") !== src) img.src = src;
      }

      var m = step.marker;
      if (m && !showAfter) {
        marker.hidden = false;
        marker.classList.toggle("move", m.kind === "move");
        marker.style.left = (m.x / W * 100) + "%";
        marker.style.top = (m.y / H * 100) + "%";
      } else {
        marker.hidden = true;
      }
    }

    document.querySelectorAll(".lang-switch button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.dataset.lang === lang) return;
        lang = btn.dataset.lang;
        try { localStorage.setItem(STORE_KEY, lang); } catch (e) { /* ignore */ }
        applyLang();
        render();
      });
    });

    prev.addEventListener("click", function () { goto(i - 1); });
    next.addEventListener("click", function () { goto(i + 1); });
    playBtn.addEventListener("click", function () { setPlaying(!playing); });
    toggleShot.addEventListener("click", function () {
      showAfter = !showAfter;
      if (showAfter && playing) setPlaying(false);
      else render();
    });

    video.addEventListener("timeupdate", function () {
      if (!playing) return;
      var n = Math.min(steps.length - 1, Math.max(0, Math.floor(video.currentTime)));
      if (n !== i) goto(n, true);
    });
    video.addEventListener("ended", function () { setPlaying(false); });
    video.addEventListener("loadeddata", function () { seekVideo(); });

    document.addEventListener("keydown", function (e) {
      if (/^(INPUT|TEXTAREA|SUMMARY)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); goto(i - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); goto(i + 1); }
      else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    });

    render();
  })();
  </script>
</body>
</html>
